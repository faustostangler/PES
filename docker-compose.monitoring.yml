services:
  cresmo-prometheus:
    image: prom/prometheus:v3.2.1
    container_name: cresmo-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - cresmo_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  cresmo-grafana:
    image: grafana/grafana:11.5.2
    container_name: cresmo-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - cresmo_grafana_data:/var/lib/grafana

  cresmo-loki:
    image: grafana/loki:3.4.2
    container_name: cresmo-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./docker/monitoring/loki.yml:/etc/loki/config.yaml:ro
      - cresmo_loki_data:/loki
    command: -config.file=/etc/loki/config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  cresmo-promtail:
    image: grafana/promtail:3.4.2
    container_name: cresmo-promtail
    restart: unless-stopped
    volumes:
      - ./docker/monitoring/promtail.yml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      cresmo-loki:
        condition: service_healthy

volumes:
  cresmo_prometheus_data:
  cresmo_grafana_data:
  cresmo_loki_data:
