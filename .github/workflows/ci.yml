name: CI Quality & Container Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality & Hermetic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Astral UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Lint & Style Verification (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Hermetic Unit Test Suite (Pytest)
        run: uv run pytest tests/cresmo -v

  docker-gate:
    name: 12-Factor Container Build & Verification
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Universal Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: pes-cresmo:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Container Execution (Preflight Check)
        run: |
          docker run --rm \
            -e GEMINI_API_KEY="ci-dummy-token-placeholder" \
            pes-cresmo:ci check-config
