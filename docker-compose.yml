services:
  cresmo-runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${CRESMO_IMAGE:-pes-cresmo:latest}
    container_name: ${CRESMO_RUNNER_CONTAINER:-cresmo-runner}
    environment:
      - ROLE=cli
      - DATA_DIR=/app/data
      - VAULT_DIR=/app/vault
    env_file:
      - path: env/compose.env
        required: false
      - path: .env
        required: false
      - path: vault/.env
        required: false
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${VAULT_DIR:-./vault}:/app/vault
    profiles:
      - tools

  cresmo-check:
    image: ${CRESMO_IMAGE:-pes-cresmo:latest}
    container_name: ${CRESMO_CHECK_CONTAINER:-cresmo-check}
    command: ["check-config"]
    environment:
      - DATA_DIR=/app/data
      - VAULT_DIR=/app/vault
    env_file:
      - path: env/compose.env
        required: false
      - path: .env
        required: false
      - path: vault/.env
        required: false
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${VAULT_DIR:-./vault}:/app/vault
    profiles:
      - tools

  cresmo-worker:
    image: ${CRESMO_IMAGE:-pes-cresmo:latest}
    container_name: ${CRESMO_WORKER_CONTAINER:-cresmo-worker}
    restart: unless-stopped
    environment:
      - ROLE=worker
      - DATA_DIR=/app/data
      - VAULT_DIR=/app/vault
    env_file:
      - path: env/compose.env
        required: false
      - path: .env
        required: false
      - path: vault/.env
        required: false
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${VAULT_DIR:-./vault}:/app/vault
    profiles:
      - worker

