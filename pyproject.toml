[project]
name = "pes"
version = "0.1.0"
description = "PES strategic workspace and tools"
requires-python = ">=3.13"
dependencies = [
    "yt-dlp>=2024.0.0",
    "openai-whisper>=20240930",
    "httpx>=0.27.0",
    "playwright>=1.42.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "debugpy>=1.8.21",
    "pandas>=3.0.5",
    "matplotlib>=3.11.1",
    "watchdog>=6.0.0",
    "beautifulsoup4",
    "lxml",
    "google-genai>=2.22.0",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
    "pyyaml>=6.0.3",
    "langfuse>=4.15.2",
    "yt-dlp-ejs>=0.8.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "prometheus-client>=0.20.0",
    "python-json-logger>=3.3.0",
    "demucs>=4.0.1",
    "scipy>=1.14.0",
    "typer>=0.12.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "polars>=1.0.0",
    "pyarrow>=18.0.0",
    "selectolax>=0.3.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
]

[project.scripts]
cresmo = "cresmo.presentation.cli:app"

[tool.mypy]
strict = true
ignore_missing_imports = false
python_version = "3.13"
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = ["src", "."]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
norecursedirs = [
    ".venv",
    ".git",
    "playground",
    "data",
    "vault",
    "mutants",
]
pythonpath = [
    "src",
    ".",
]
addopts = [
    "--import-mode=importlib",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.0",
    "mutmut>=3.7.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
    "polyfactory>=2.16.0",
    "schemathesis>=3.35.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = [
    "EXE002",  # Executable permissions are set by NTFS mount mask
    "B008",    # FastAPI Depends in argument defaults
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cresmo", "src/identity", "src/shared_kernel"]

[tool.mutmut]
source_paths = ["src"]
also_copy = [
    ".env",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]



