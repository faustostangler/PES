[project]
name = "pes"
version = "0.1.0"
description = "PES strategic workspace and tools"
requires-python = ">=3.13"
dependencies = [
    "yt-dlp>=2024.0.0",
    "openai-whisper>=20240930",
    "httpx>=0.27.0",
    "playwright>=1.42.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "debugpy>=1.8.21",
    "pandas>=3.0.5",
    "matplotlib>=3.11.1",
    "watchdog>=6.0.0",
    "beautifulsoup4",
    "lxml",
    "google-genai>=2.22.0",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
    "pyyaml>=6.0.3",
    "langfuse>=4.15.2",
]

[project.scripts]
cresmo = "cresmo.presentation.cli:main"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [
    "src",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
norecursedirs = [
    ".venv",
    ".git",
    "playground",
    "data",
    "vault",
]
pythonpath = [
    "src",
]

[dependency-groups]
dev = [
    "debugpy",
    "mutmut>=3.7.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = [
    "EXE002",  # Executable permissions are set by NTFS mount mask
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


