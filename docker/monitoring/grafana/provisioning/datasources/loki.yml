apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://cresmo-loki:3100
    isDefault: false
    editable: false
    jsonData:
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: '"otelTraceID":"([a-f0-9]+)"'
          name: TraceID
          url: "$${__value.raw}"
